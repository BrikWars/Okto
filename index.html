<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Welche Zahl bin ich?</title>
<style>
  :root{
    --bg:#EAF4FF; --board:#FFFFFF; --ink:#26324A; --muted:#8A97B1;
    --star:#FFC531; --ok:#3FBF7F; --no:#F0665F; --pad:#F3F7FD;
    --n1:#E8362E; --n2:#FF8A1E; --n3:#FFD21E; --n4:#3DBE4A; --n5:#2E7BFF;
    --n6:#8E44D6; --n8:#FF5FB0; --n9:#8D8D8D; --n10:#FFFFFF; --n10b:#E8362E;
    /* 7 = Regenbogen aus den Farben 1–6 */
    --n7:linear-gradient(180deg,var(--n1) 0 16.7%,var(--n2) 0 33.4%,var(--n3) 0 50%,var(--n4) 0 66.7%,var(--n5) 0 83.4%,var(--n6) 0 100%);
  }
  /* 10 = weiß mit roter Umrandung */
  .cell.ten{box-shadow:inset 0 0 0 3px var(--n10b),inset 0 -3px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.35)}
  .dot.ten,.legend .ten,.bit.ten{box-shadow:inset 0 0 0 2px var(--n10b)}
  .legend .ten{color:var(--n10b);text-shadow:none}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:"Nunito","SF Pro Rounded",ui-rounded,"Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:4px solid #4DA3FF;outline-offset:2px}

  #top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0;gap:12px;flex:0 0 auto}
  #stars{display:flex;gap:4px;flex-wrap:wrap;max-width:60vw;min-height:26px;align-items:center}
  .star{width:22px;height:22px;color:var(--star);filter:drop-shadow(0 1px 0 rgba(0,0,0,.12))}
  .star.new{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  #right{display:flex;gap:6px;align-items:center}
  .chip{background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;color:var(--muted);box-shadow:0 2px 0 rgba(38,50,74,.08)}
  .icon{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 rgba(38,50,74,.08);color:var(--muted)}
  .icon svg{width:22px;height:22px}

  #stage{flex:1 1 auto;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;padding:10px 16px 14px;min-height:0}
  @media (orientation:landscape){#stage{grid-template-rows:none;grid-template-columns:minmax(0,1fr) minmax(0,44%)}}
  #boardWrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
  #board{
    background:var(--board);border-radius:28px;box-shadow:0 6px 0 rgba(38,50,74,.08);
    width:100%;height:100%;padding:60px 16px 16px;position:relative;overflow:hidden;
    display:flex;align-items:flex-end;justify-content:center;
  }
  #hint{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:800;color:var(--muted);font-size:17px;pointer-events:none;line-height:1.1}
  #hint.eqmode{color:var(--ink);font-size:clamp(26px,5vmin,44px);font-weight:900;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  #figure{display:grid;gap:3px;transform-origin:center bottom;position:relative;z-index:1}
  #scene{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.2s ease;pointer-events:none;z-index:0}
  #board.scene #scene{opacity:.12}
  #figure.enter{animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
  #figure.happy{animation:bounce .7s ease}
  #figure.split{display:flex;align-items:flex-end;justify-content:center}
  #figure.split.stack{flex-direction:column;align-items:center}
  .part{display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .part .grid{display:grid;gap:3px}
  .part .lbl{font-weight:900;color:var(--ink);line-height:1}
  .cell.gone{opacity:.42;position:relative}
  .cell.gone::after{content:'';position:absolute;inset:14%;background:linear-gradient(45deg,transparent 42%,var(--ink) 42%,var(--ink) 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--ink) 42%,var(--ink) 58%,transparent 58%)}
  .op{font-weight:900;color:var(--ink);line-height:1;align-self:center;white-space:nowrap;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .cell{
    width:100%;height:100%;border-radius:16%;position:relative;transition:transform .15s,filter .15s;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.35);
  }
  .cell.lit{transform:scale(1.12);filter:brightness(1.18) saturate(1.2);z-index:1}
  .cell.dim{opacity:.35}
  #bigNum{
    position:absolute;left:0;right:0;top:44px;bottom:16px;display:grid;place-items:center;pointer-events:none;
    font-size:min(24vh,30vw);font-weight:900;color:var(--ink);opacity:0;text-align:center;line-height:1;
    text-shadow:0 4px 0 #fff,0 -4px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,0 8px 24px rgba(38,50,74,.18);
  }
  #bigNum.show{opacity:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  .fab{position:absolute;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--pad);display:grid;place-items:center;box-shadow:0 3px 0 rgba(38,50,74,.1);color:var(--muted)}
  .fab svg{width:26px;height:26px}
  #countBtn{left:14px}
  #splitBtn{right:14px}
  #splitBtn.on{background:var(--ink);color:#fff}

  #pad{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-auto-rows:var(--keyH,52px);gap:6px;align-content:end;min-height:0}
  @media (orientation:landscape){#pad{align-content:center}}
  .key{
    height:100%;min-height:0;min-width:0;border-radius:14px;background:#fff;font-weight:900;color:var(--ink);
    font-size:var(--keyFont,20px);box-shadow:0 3px 0 rgba(38,50,74,.12);
    display:grid;place-items:center;transition:transform .08s,background .15s;position:relative;
  }
  .key .dot{position:absolute;left:4px;top:4px;width:22%;height:22%;min-width:7px;min-height:7px;border-radius:30%}
  #pad.dense .key{border-radius:9px}
  #pad.dense .key .dot{left:3px;top:3px}
  .key:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0)}
  .key.good,.key.reveal{background:var(--ok);color:#fff}
  .key.good{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .key.bad{background:var(--no);color:#fff;animation:shake .4s}
  #pad.locked .key{pointer-events:none}
  /* digit pad */
  #pad.digits{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,360px);margin:0 auto}
  @media (orientation:landscape){#pad.digits{width:min(100%,320px)}}
  #ans{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:8px}
  .ansSlot{width:calc(var(--keyH,52px)*.86);height:var(--keyH,52px);border-radius:14px;background:#fff;box-shadow:inset 0 0 0 3px rgba(38,50,74,.14);font-weight:900;font-size:calc(var(--keyH,52px)*.58);color:var(--ink);display:grid;place-items:center;transition:background .15s}
  .ansSlot.next{box-shadow:inset 0 0 0 3px var(--n5)}
  #ans.good .ansSlot,#ans.reveal .ansSlot{background:var(--ok);color:#fff;box-shadow:none}
  #ans.good .ansSlot{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  #ans.bad .ansSlot{background:var(--no);color:#fff;box-shadow:none;animation:shake .4s}
  .key.del{color:var(--muted)}

  #settings{position:fixed;inset:0;background:rgba(38,50,74,.45);display:none;padding:20px;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #settings.open{display:flex}
  .sheet{background:#fff;border-radius:24px;padding:22px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto}
  .sheet h2{margin:0 0 4px;font-size:22px}
  .sheet p{margin:0 0 16px;color:var(--muted);font-weight:700}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #EEF2F8;font-weight:800}
  .seg{display:flex;background:var(--pad);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap;justify-content:flex-end}
  .seg button{padding:10px 14px;min-height:42px;border-radius:9px;font-weight:800;color:var(--muted);font-size:15px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(38,50,74,.1)}
  .legend{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0 2px}
  .legend div{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
  #bonus{position:fixed;inset:0;display:none;z-index:20;background:#BFE5FF;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
  #bonus.open{display:block}
  #bonus.intro{background:transparent}
  #bonus.intro .bhud,#bonus.intro #bMsg{display:none}
  #bonusCanvas{position:absolute;inset:0;display:block}
  .bhud{position:absolute;left:0;right:0;top:0;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;font-weight:900;color:var(--ink)}
  .bpill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px 6px 14px;font-size:16px;box-shadow:0 4px 14px rgba(38,50,74,.15)}
  .beg{display:inline-flex;width:34px;height:40px;border-radius:50%/60% 60% 40% 40%;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);font-size:19px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
  .beg.ten{color:var(--n10b);text-shadow:none;box-shadow:inset 0 0 0 3px var(--n10b)}
  #bProg{display:flex;gap:4px;background:rgba(255,255,255,.7);border-radius:999px;padding:7px 10px}
  .slot{width:13px;height:16px;border-radius:50%/60% 60% 40% 40%;background:rgba(38,50,74,.12);box-shadow:inset 0 0 0 2px rgba(38,50,74,.2)}
  .slot.on{background:var(--n8);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
  #bX{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);font-weight:900;font-size:18px;color:var(--muted);box-shadow:0 4px 14px rgba(38,50,74,.15)}
  #bMsg{position:absolute;left:0;right:0;top:24%;text-align:center;font-size:clamp(30px,8vmin,64px);font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(38,50,74,.35),0 6px 20px rgba(38,50,74,.25);pointer-events:none;opacity:0;transition:opacity .25s}
  #bMsg.show{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .close{width:100%;margin-top:16px;padding:14px;border-radius:14px;background:var(--ink);color:#fff;font-weight:900;font-size:17px}

  .bit{position:absolute;width:14px;height:14px;border-radius:3px;pointer-events:none;animation:fly 1.1s ease-out forwards}
  @keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
  @keyframes drop{0%{transform:translateY(-40px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
  @keyframes bounce{0%,100%{transform:none}30%{transform:translateY(-18px) scaleX(.96) scaleY(1.06)}60%{transform:translateY(0) scaleX(1.05) scaleY(.94)}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="top">
  <div id="stars" aria-label="Sterne"></div>
  <div id="right">
    <div class="chip" id="bonusChip">🦖 0/10</div>
    <div class="chip" id="rangeChip">bis 5</div>
    <button class="icon" id="soundBtn" aria-label="Ton an/aus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    <button class="icon" id="gearBtn" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</div>

<div id="stage">
  <div id="boardWrap">
    <div id="board">
      <svg id="scene" viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <circle cx="340" cy="40" r="22" fill="#FFB800"/>
        <g fill="#26324A"><ellipse cx="70" cy="42" rx="22" ry="11"/><ellipse cx="88" cy="36" rx="16" ry="12"/><ellipse cx="250" cy="60" rx="24" ry="10"/><ellipse cx="268" cy="54" rx="14" ry="10"/></g>
        <path d="M-10 200 Q60 120 140 200Z" fill="#6B4FA0"/>
        <path d="M110 200 L165 70 L185 70 L240 200Z" fill="#4A3580"/>
        <path d="M165 70 L185 70 L181 82 L169 82Z" fill="#FF6B3D"/>
        <g fill="#26324A" opacity=".5"><circle cx="176" cy="56" r="8"/><circle cx="184" cy="42" r="10"/><circle cx="176" cy="26" r="12"/></g>
        <path d="M220 200 Q300 130 410 200Z" fill="#6B4FA0"/>
        <g fill="#1F7A3A"><ellipse cx="305" cy="168" rx="34" ry="16"/><path d="M290 156 q-18 -6 -36 4 q10 -14 36 -12z"/><path d="M300 155 q-8 -20 8 -34 q4 18 0 34z"/><path d="M318 156 q16 -12 34 -6 q-20 0 -34 12z"/><rect x="298" y="165" width="8" height="38"/><rect x="288" y="184" width="8" height="18" transform="rotate(-8 292 193)"/><rect x="312" y="184" width="8" height="18" transform="rotate(8 316 193)"/></g>
        <path d="M60 200 q10 -50 30 -66 q-6 22 -2 66" fill="#1F7A3A"/>
        <path d="M78 200 q-14 -46 -36 -60 q10 20 24 60" fill="#1F7A3A"/>
        <g fill="#1F7A3A"><ellipse cx="60" cy="184" rx="30" ry="14"/><path d="M32 176 q-26 -6 -36 12 l34 8z"/><rect x="40" y="188" width="8" height="18"/><rect x="58" y="190" width="8" height="16"/><rect x="74" y="188" width="8" height="18"/><path d="M84 170 q4 -40 24 -52 q-2 16 -4 30" stroke="#1F7A3A" stroke-width="12" fill="none" stroke-linecap="round"/><ellipse cx="108" cy="118" rx="9" ry="6"/></g>
        <g fill="#26324A"><ellipse cx="220" cy="190" rx="22" ry="10"/><circle cx="240" cy="184" r="9"/><path d="M198 186 q-16 -6 -26 2 l24 8z"/><rect x="206" y="196" width="6" height="12"/><rect x="216" y="197" width="6" height="12"/><rect x="226" y="197" width="6" height="12"/><path d="M236 176 l3 -9 l4 9z M244 177 l5 -7 l2 8z"/></g>
        <rect x="-10" y="200" width="420" height="70" fill="#2E8B57"/>
        <rect x="-10" y="212" width="420" height="60" fill="#8B5A2B"/>
      </svg>
      <div id="hint">Welche Zahl bin ich?</div>
      <div id="figure"></div>
      <div id="bigNum"></div>
      <button class="fab" id="countBtn" aria-label="Blöcke zählen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="fab" id="splitBtn" aria-label="Zerlegen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="7" height="14" rx="2"/><rect x="14" y="5" width="7" height="14" rx="2"/></svg></button>
    </div>
  </div>
  <div id="pad"></div>
</div>

<div id="settings">
  <div class="sheet">
    <h2>Für Eltern</h2>
    <p>Jede Zahl von 1 bis 10 hat immer dieselbe Farbe. Größere Zahlen zeigen ihre Zehner und den Rest.</p>
    <div class="legend" id="legend"></div>
    <div class="row"><span>Zahlen</span><div class="seg" id="rangeSeg"></div></div>
    <div class="row"><span>Aufgaben</span><div class="seg" id="modeSeg"></div></div>
    <div class="row"><span>Eingabe</span><div class="seg" id="inputSeg"></div></div>
    <div class="row"><span>Reihenfolge</span><div class="seg" id="dirSeg"></div></div>
    <div class="row"><span>Sprache</span><div class="seg" id="langSeg"><button data-l="de">Deutsch</button><button data-l="en">English</button></div></div>
    <div class="row"><span>Bonus-Spiel</span><button id="bonusBtn" style="font-weight:800;color:var(--n8)">Jetzt spielen</button></div>
    <div class="row"><span>Sterne</span><button id="resetBtn" style="font-weight:800;color:var(--no)">Zurücksetzen</button></div>
    <button class="close" id="closeBtn">Weiterspielen</button>
  </div>
</div>

<div id="bonus">
  <canvas id="bonusCanvas"></canvas>
  <div class="bhud">
    <div class="bpill"><span id="bCatch">Fang die</span><span id="bTarget"></span></div>
    <div id="bProg"></div>
    <button id="bX" aria-label="Zurück">✕</button>
  </div>
  <div id="bMsg"></div>
</div>

<script>
(() => {
  const LEVELS = [5,10,20,50,100];
  const T = {
    de:{ask:'Welche Zahl bin ich?',right:['Richtig!','Super!','Genau!','Ja!','Toll gemacht!'],again:'Hmm, zähl nochmal.',
        reveal:'Ich bin',range:n=>'bis '+n,auto:'Auto',plus:'plus',minus:'minus',times:'mal',is:'ist',askAdd:'Wie viel ist',modes:{zahlen:'Zahlen',plus:'Plus',minus:'Minus',mal:'Mal',mix:'Gemischt'},input:{keys:'Tasten',digits:'Ziffern'},order:{ltr:'Links → rechts',rtl:'Rechts → links'},
        bonusTitle:'Bonus!',catchIt:'Fang die',bonusStart:n=>`Bonus! Hilf Okto. Tippe zum Springen. Fang die ${n}!`,bonusNext:n=>`Jetzt die ${n}!`,notThat:(n,t)=>`Das ist die ${n}. Fang die ${t}!`,oops:'Hoppla!',bonusWin:'Geschafft! Super, Okto!',bonusBtn:'Jetzt spielen',hello:'Hallo! Ich bin Okto. Lass uns Zahlen raten!',toDino:'Auf in die Dino-Welt!',back:'Das war super! Weiter geht es mit den Zahlen.'},
    en:{ask:'Which number am I?',right:['Correct!','Great!','Yes!','Well done!','That\'s it!'],again:'Hmm, count again.',
        reveal:'I am',range:n=>'up to '+n,auto:'Auto',plus:'plus',minus:'minus',times:'times',is:'is',askAdd:'What is',modes:{zahlen:'Numbers',plus:'Plus',minus:'Minus',mal:'Times',mix:'Mixed'},input:{keys:'Keys',digits:'Digits'},order:{ltr:'Left → right',rtl:'Right → left'},
        bonusTitle:'Bonus!',catchIt:'Catch the',bonusStart:n=>`Bonus! Help Okto. Tap to jump. Catch the ${n}!`,bonusNext:n=>`Now the ${n}!`,notThat:(n,t)=>`That's the ${n}. Catch the ${t}!`,oops:'Oops!',bonusWin:'You did it! Great, Okto!',bonusBtn:'Play now',hello:'Hi! I am Okto. Let\'s guess numbers!',toDino:'Off to dino land!',back:'That was great! Back to the numbers.'}
  };
  const DEF = {stars:0,level:0,lock:-1,lang:'de',sound:true,streak:0,miss:0,modes:{zahlen:true,plus:false,minus:false,mal:false},bonusCount:0,input:'keys',digitDir:'ltr'};
  const S = load();
  function load(){
    let s; try{ s=Object.assign({},DEF,JSON.parse(localStorage.getItem('wzbi2')||'{}')); }catch(e){ s=Object.assign({},DEF); }
    if(s.mode){ // older versions had a single mode
      s.modes={zahlen:s.mode==='zahlen'||s.mode==='mix',plus:s.mode==='plus'||s.mode==='mix',minus:s.mode==='mix',mal:s.mode==='mix'}; delete s.mode;
    }
    s.modes=Object.assign({zahlen:true,plus:false,minus:false,mal:false},s.modes||{});

  const $ = id => document.getElementById(id);
  const board=$('board'), fig=$('figure'), pad=$('pad'), big=$('bigNum'), hint=$('hint'), splitBtn=$('splitBtn');
  let cur=null, L=null, tries=0, busy=false, recent=[], split=false;

  // ---------- layouts: every layout is a list of rectangular parts ----------

  function layout(n){

    const opts=[];

    else { opts.push('tens','tens','rows10'); if(pairs.length) opts.push('rect','rect'); if(n%10===0) opts.push('tens'); }
    const kind = opts[Math.floor(Math.random()*opts.length)];

  // ---------- addition: a + b = ? ----------

  // ---------- bonus mini game: the pink 8 runs through dino land ----------
  const Bonus=(()=>{

      // face on the top row
      const ey=-h+u*.5, blink=((performance.now()/1000)%3.7)<.13?.15:1;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(-u*.5,ey,u*.26,u*.3*blink,0,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(u*.5,ey,u*.26,u*.3*blink,0,0,7); ctx.fill();
      ctx.fillStyle='#26324A'; ctx.beginPath(); ctx.arc(-u*.42,ey+u*.04,u*.13*blink,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(u*.58,ey+u*.04,u*.13*blink,0,7); ctx.fill();
      ctx.strokeStyle='#26324A'; ctx.lineWidth=u*.09; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(0,-h+u*1.2,u*.35,.15,Math.PI-.15); ctx.stroke();
      // cheeks
      ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(-u*.75,-h+u*1.25,u*.13,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(u*.75,-h+u*1.25,u*.13,0,7); ctx.fill();
      ctx.restore();
    }
    function loop(now){
      const dt=Math.min(.05,(now-last)/1000); last=now;
      update(dt); if(phase!=='play'&&phase!=='win') return; // stopped (or handed over to the way-back scene) during update
      draw(); raf=requestAnimationFrame(loop);
    }
    return {start,stop,intro};
  })();

  // ---------- flow ----------
  function next(){
    busy=false; tries=0; split=false; splitBtn.classList.remove('on'); pad.classList.remove('locked');
    big.className=''; big.textContent=''; hint.className=''; board.classList.remove('scene');
    buildPad();
    const active=Object.keys(S.modes).filter(k=>S.modes[k]); if(!active.length) active.push('zahlen');
    const mode=active[Math.floor(Math.random()*active.length)];
    splitBtn.style.visibility = mode!=='zahlen' ? 'hidden' : '';
    if(mode!=='zahlen'){
      if(mode==='plus'){ const [a,b]=pickAdd(); cur=a+b; L=layoutAdd(a,b); split=true; }
      else if(mode==='minus'){ const [a,b]=pickSub(); cur=a-b; L=layoutSub(a,b); }
      else { const [a,b]=pickMul(); cur=a*b; L=layoutMul(a,b); }
      hint.textContent=L.ask; hint.classList.add('eqmode'); render();
      speak(`${T[S.lang].askAdd} ${sayEq(L.say.slice(0,3))}?`);
    } else {
      hint.textContent=T[S.lang].ask; cur=pick(); L=layout(cur); render(); speak(T[S.lang].ask);
    }
    drawSlots();
  }

  function celebrate(btn){
    busy=true; pad.classList.add('locked'); btn.classList.add('good');
    fig.classList.add('happy'); board.classList.add('scene');
    const praise=T[S.lang].right[Math.floor(Math.random()*T[S.lang].right.length)];
    big.textContent=cur; big.classList.add('show'); layoutBig();
    speak(`${L.arith ? sayEq(L.say) : cur}! ${praise}`);
    addStar(); S.streak++; S.miss=0; S.bonusCount=(S.bonusCount||0)+1; drawBonusChip();
    if(S.lock<0 && S.streak>=4 && S.level<LEVELS.length-1){ S.level++; S.streak=0; }
    save();
    if(L.arith){
      const eq=L.eq;
      setTimeout(()=>{ L=resultLayout(cur); split=false; render(); hint.textContent=eq; },900);
      setTimeout(afterRight,3400);
    } else if(L.eq){
      setTimeout(()=>{ toggleSplit(true); big.className=''; hint.textContent=L.eq; hint.classList.add('eqmode'); speak(sayEq(L.say)); },1200);
      setTimeout(afterRight,4200);
    } else setTimeout(afterRight,1600);
  }

  // after 10 right answers the bonus game starts, then it's back to the numbers
  function afterRight(){
    if(S.bonusCount>=10){ S.bonusCount=0; save(); drawBonusChip(); startBonus(); } else next();
  }
  function drawBonusChip(){ $('bonusChip').textContent=`🦖 ${Math.min(S.bonusCount||0,10)}/10`; }
  function startBonus(){
    busy=true; pad.classList.add('locked'); cancelSpeech(); big.className=''; big.textContent='';
    const opts={maxN:maxN(),sound:S.sound,speak,t:T[S.lang],done:()=>Bonus.intro({mode:'back',rect:board.getBoundingClientRect(),speak,sound:S.sound,t:T[S.lang],say:T[S.lang].back,done:()=>{ $('bonus').classList.remove('open'); next(); }})};
    Bonus.intro({mode:'bonus',rect:board.getBoundingClientRect(),speak,sound:S.sound,t:T[S.lang],say:T[S.lang].toDino,done:()=>Bonus.start(opts)});
  }
  // the 8 in front of the mirror, then the mirror becomes the board
  function playIntro(say){
    busy=true; pad.classList.add('locked'); cancelSpeech();
    Bonus.intro({mode:'start',rect:board.getBoundingClientRect(),speak,sound:S.sound,t:T[S.lang],say:say?T[S.lang].hello:null,done:()=>{ $('bonus').classList.remove('open'); next(); }});
  }

  function answer(n,btn){
    if(busy) return;
    if(n===cur){ celebrate(btn); return; }
    tries++; btn.classList.add('bad'); setTimeout(()=>btn.classList.remove('bad'),450);
    if(tries===1){ speak(T[S.lang].again); return; }
    busy=true; pad.classList.add('locked'); S.miss++; S.streak=0;
    if(S.lock<0 && S.miss>=3 && S.level>0){ S.level--; S.miss=0; }
    save();
    countOut(()=>{
      showAnswerInPad();
      big.textContent=cur; big.classList.add('show'); layoutBig();
      if(L.arith){ const eq=L.eq, say=L.say; L=resultLayout(cur); split=false; render(); hint.textContent=eq; speak(sayEq(say)); setTimeout(next,2600); }
      else { speak(`${T[S.lang].reveal} ${cur}.`); setTimeout(next,2200); }
    });
  }

  function countOut(done){
    if(split && !L.arith) toggleSplit(false);
    const cells=[...fig.querySelectorAll('.cell:not(.gone)')];
    cells.forEach(c=>c.classList.add('dim')); cancelSpeech();
    let i=0;
    const step=()=>{
      if(i>0) cells[i-1].classList.remove('lit');
      if(i>=cells.length){ cells.forEach(c=>c.classList.remove('dim')); done&&done(); return; }
      cells[i].classList.remove('dim'); cells[i].classList.add('lit');
      speak(String(i+1),{keep:true,rate:1.05}); i++;
      setTimeout(step, cur>20?380:550);
    };
    step();
  }
  $('countBtn').addEventListener('click',()=>{ if(busy) return; busy=true; pad.classList.add('locked'); countOut(()=>{busy=false;pad.classList.remove('locked');}); });
  splitBtn.addEventListener('click',()=>{ if(busy||L.arith) return; toggleSplit(); });

  // ---------- stars ----------
  const starSVG='<svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
  function drawStars(){ const box=$('stars'); box.innerHTML=''; for(let i=0;i<Math.min(S.stars,15);i++) box.insertAdjacentHTML('beforeend',starSVG); if(S.stars>15) box.insertAdjacentHTML('beforeend',`<span class="chip">${S.stars}</span>`); }
  function addStar(){ S.stars++; drawStars(); const l=$('stars').querySelector('.star:last-of-type'); if(l) l.classList.add('new'); if(S.stars%5===0) confetti(); }
  function confetti(){ for(let i=0;i<26;i++){ const b=document.createElement('div'); b.className='bit'; b.style.background=colorOf(i%10+1); if(i%10+1===10) b.classList.add('ten'); b.style.left='50%'; b.style.top='45%'; b.style.setProperty('--dx',(Math.random()*2-1)*260+'px'); b.style.setProperty('--dy',(Math.random()*-1)*300-60+'px'); board.appendChild(b); setTimeout(()=>b.remove(),1200);} }

  // ---------- settings ----------
  const seg=$('rangeSeg');
  function drawSeg(){
    seg.innerHTML='';
    [-1,...LEVELS.keys()].forEach(i=>{ const b=document.createElement('button'); b.textContent=i<0?T[S.lang].auto:LEVELS[i]; b.className=S.lock===i?'on':''; b.addEventListener('click',()=>{S.lock=i;S.streak=0;S.miss=0;save();drawSeg();}); seg.appendChild(b); });
    const ms=$('modeSeg'); ms.innerHTML='';
    const keys=['zahlen','plus','minus','mal'], allOn=keys.every(k=>S.modes[k]);
    keys.forEach(m=>{ const b=document.createElement('button'); b.textContent=T[S.lang].modes[m]; b.className=S.modes[m]&&!allOn?'on':'';
      b.addEventListener('click',()=>{ if(allOn){ keys.forEach(k=>S.modes[k]=false); S.modes[m]=true; } else { S.modes[m]=!S.modes[m]; if(!keys.some(k=>S.modes[k])) S.modes[m]=true; } save(); drawSeg(); }); ms.appendChild(b); });
    const mix=document.createElement('button'); mix.textContent=T[S.lang].modes.mix; mix.className=allOn?'on':'';
    mix.addEventListener('click',()=>{ keys.forEach(k=>S.modes[k]=true); save(); drawSeg(); }); ms.appendChild(mix);
    const mkSeg=(id,key,vals,labels)=>{ const el=$(id); el.innerHTML=''; vals.forEach(v=>{ const b=document.createElement('button'); b.textContent=labels[v]; b.className=S[key]===v?'on':''; b.addEventListener('click',()=>{S[key]=v;save();drawSeg();}); el.appendChild(b); }); };
    mkSeg('inputSeg','input',['keys','digits'],T[S.lang].input);
    mkSeg('dirSeg','digitDir',['ltr','rtl'],T[S.lang].order);
    $('dirSeg').parentElement.style.opacity=digitMode()?1:.45;
    $('langSeg').querySelectorAll('button').forEach(b=>b.className=b.dataset.l===S.lang?'on':'');
    $('bonusBtn').textContent=T[S.lang].bonusBtn;
  }
  const lg=$('legend'); for(let i=1;i<=10;i++){ const d=document.createElement('div'); d.style.background=colorOf(i); d.textContent=i; if(i===10) d.classList.add('ten'); lg.appendChild(d); }
  $('langSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.l;save();drawSeg();}));
  $('bonusBtn').addEventListener('click',()=>{$('settings').classList.remove('open');startBonus();});
  $('resetBtn').addEventListener('click',()=>{S.stars=0;S.level=0;S.streak=0;S.miss=0;S.bonusCount=0;save();drawStars();drawBonusChip();$('settings').classList.remove('open');playIntro(true);});
  $('gearBtn').addEventListener('click',()=>{drawSeg();$('settings').classList.add('open');});
  $('closeBtn').addEventListener('click',()=>{$('settings').classList.remove('open');next();});
  $('soundBtn').addEventListener('click',()=>{S.sound=!S.sound;save();$('wave').style.opacity=S.sound?1:.25;if(!S.sound)cancelSpeech();});
  $('wave').style.opacity=S.sound?1:.25;

  let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{fitPad();if(L)render();},150);});
  drawStars(); drawBonusChip(); requestAnimationFrame(()=>playIntro(false));
})();
</script>
</body>
</html>
