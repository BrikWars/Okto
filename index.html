<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Anky und die Dino-Freunde</title>
<style>
  :root{
    --bg:#EAF4FF; --ink:#26324A; --muted:#7C88A1; --ok:#3DBE7A; --no:#FF6B6B;
    --n1:#E8362E; --n2:#FF8A1E; --n3:#FFD21E; --n4:#3DBE4A; --n5:#2E7BFF;
    --n6:#8E44D6; --n8:#FF5FB0; --n9:#8D8D8D; --n10:#FFFFFF; --n10b:#E8362E;
    --n7:linear-gradient(180deg,var(--n1) 0 16.7%,var(--n2) 0 33.4%,var(--n3) 0 50%,var(--n4) 0 66.7%,var(--n5) 0 83.4%,var(--n6) 0 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#7CC96B;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
  button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
  #game{position:fixed;inset:0;display:block}
  /* HUD */
  .hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
  .hud>*{pointer-events:auto}
  .chip{background:rgba(255,255,255,.88);border-radius:999px;padding:7px 12px;font-weight:900;font-size:15px;box-shadow:0 4px 14px rgba(38,50,74,.15);display:flex;align-items:center;gap:6px}
  .ib{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 4px 14px rgba(38,50,74,.15);font-size:18px;display:grid;place-items:center;color:var(--ink)}
  .ib.off{opacity:.45}
  #sub{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:min(92vw,560px);background:rgba(255,255,255,.92);border-radius:18px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 6px 20px rgba(38,50,74,.18);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;line-height:1.3}
  #sub.show{opacity:1}
  #sub b{color:var(--n8)}
  /* task panel */
  #task{position:fixed;inset:0;background:rgba(38,50,74,.35);display:none;z-index:10;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
  #task.open{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px}
  @media (orientation:landscape){#task.open{grid-template-rows:none;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:stretch}}
  #board{position:relative;background:#fff;border-radius:22px;box-shadow:0 12px 40px rgba(38,50,74,.25);padding:60px 16px 16px;display:flex;align-items:flex-end;justify-content:center;min-height:0;overflow:hidden}
  #hint{position:absolute;left:12px;right:12px;top:12px;text-align:center;font-weight:900;font-size:clamp(16px,3.4vmin,26px);line-height:1.2}
  #hint.eq{font-size:clamp(24px,6vmin,44px)}
  #okto{position:absolute;left:10px;bottom:10px;width:34px;height:64px;display:grid;grid-template-columns:1fr 1fr;gap:2px;opacity:.9}
  #okto i{background:var(--n8);border-radius:3px}
  #okto i:first-child::after{content:'';position:absolute}
  #fig{display:grid;gap:3px;position:relative;z-index:1}
  #fig.row{display:flex;align-items:flex-end;gap:14px}
  .part{display:flex;flex-direction:column;align-items:center;gap:4px}
  .part .grid{display:grid;gap:3px}
  .lbl{font-weight:900;color:var(--ink)}
  .op{font-weight:900;align-self:center;padding-bottom:22px}
  .cell{border-radius:18%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .15s,filter .15s,opacity .15s}
  .cell.ten{box-shadow:inset 0 0 0 3px var(--n10b),inset 0 -3px 0 rgba(0,0,0,.16)}
  .cell.gone{opacity:.42;position:relative}
  .cell.gone::after{content:'';position:absolute;inset:14%;background:linear-gradient(45deg,transparent 42%,var(--ink) 42%,var(--ink) 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--ink) 42%,var(--ink) 58%,transparent 58%)}
  .cell.lit{transform:scale(1.18);filter:brightness(1.12)}
  .cell.dim{opacity:.35}
  #big{position:absolute;left:0;right:0;top:56px;bottom:16px;display:grid;place-items:center;font-weight:900;font-size:min(20vh,26vw);color:var(--ink);text-shadow:0 6px 0 rgba(38,50,74,.12);opacity:0;transform:scale(.6);transition:all .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;z-index:2}
  #big.show{opacity:1;transform:scale(1)}
  #pad{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;align-content:end;min-height:0}
  #pad.digits{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,340px);margin:0 auto}
  @media (orientation:landscape){#pad{align-content:center}}
  .key{position:relative;height:var(--keyH,52px);min-width:0;border-radius:12px;background:#fff;font-weight:900;font-size:var(--keyFont,20px);color:var(--ink);box-shadow:0 4px 0 rgba(38,50,74,.14),0 6px 16px rgba(38,50,74,.14);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8%;transition:transform .08s,background .15s}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(38,50,74,.14)}
  .key .dot{position:absolute;left:4px;top:4px;width:22%;height:22%;min-width:7px;min-height:7px;border-radius:30%}
  .key .dot.ten{box-shadow:inset 0 0 0 2px var(--n10b)}
  .key.good{background:var(--ok);color:#fff}
  .key.bad{background:var(--no);color:#fff;animation:shake .4s}
  .key.reveal{background:var(--ok);color:#fff;animation:pop .5s}
  .key.del{color:var(--muted)}
  #pad.locked .key{pointer-events:none}
  #ans{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:8px}
  .ansSlot{width:calc(var(--keyH,52px)*.86);height:var(--keyH,52px);border-radius:14px;background:#fff;box-shadow:inset 0 0 0 3px rgba(38,50,74,.14);font-weight:900;font-size:calc(var(--keyH,52px)*.58);display:grid;place-items:center}
  .ansSlot.next{box-shadow:inset 0 0 0 3px var(--n5)}
  #ans.good .ansSlot,#ans.reveal .ansSlot{background:var(--ok);color:#fff;box-shadow:none}
  #ans.bad .ansSlot{background:var(--no);color:#fff;box-shadow:none;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes drop{0%{transform:translateY(-30px);opacity:0}100%{transform:translateY(0);opacity:1}}
  #fig.enter .cell{animation:drop .4s both}
  /* settings */
  #settings{position:fixed;inset:0;background:rgba(38,50,74,.45);display:none;padding:20px;z-index:20;overflow-y:auto}
  #settings.open{display:block}
  .sheet{background:#fff;border-radius:24px;padding:22px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto}
  .sheet h2{margin:0 0 6px;font-size:20px}
  .sheet p{margin:0 0 14px;color:var(--muted);font-weight:700;font-size:14px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #EEF2F8;font-weight:800}
  .seg{display:flex;gap:4px;background:#F1F5FB;border-radius:12px;padding:3px;flex-wrap:wrap;justify-content:flex-end}
  .seg button{padding:10px 14px;min-height:42px;border-radius:9px;font-weight:800;color:var(--muted);font-size:15px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(38,50,74,.15)}
  .close{margin-top:14px;width:100%;padding:14px;border-radius:14px;background:var(--ink);color:#fff;font-weight:900;font-size:16px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <div class="chip" id="hearts" style="color:#E8362E;letter-spacing:1px">♥♥♥♥♥</div>
    <div class="chip">🍒 <span id="berN">0</span></div>
    <div class="chip" id="crys">💎 <span id="crysN">0</span></div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="ib" id="musicBtn" aria-label="Musik">♪</button>
    <button class="ib" id="soundBtn" aria-label="Ton">🔊</button>
    <button class="ib" id="gearBtn" aria-label="Einstellungen">⚙️</button>
  </div>
</div>
<div id="sub"></div>

<div id="task">
  <div id="board">
    <div id="hint"></div>
    <div id="fig"></div>
    <div id="big"></div>
  </div>
  <div id="pad"></div>
</div>

<div id="settings">
  <div class="sheet">
    <h2>Für Eltern</h2>
    <p>Anky läuft dorthin, wo man tippt. Büsche schütteln gibt Beeren, Felsbrocken brauchen mehrere Schläge, der T-Rex drei. Okto am Startplatz heilt.</p>
    <div class="row"><span>Eingabe</span><div class="seg" id="inputSeg"></div></div>
    <div class="row"><span>Reihenfolge</span><div class="seg" id="dirSeg"></div></div>
    <div class="row"><span>Stimme</span><select id="voiceSel" style="font:inherit;font-weight:800;padding:8px;border-radius:10px;border:2px solid #EEF2F8;max-width:60%"></select></div>
    <div class="row"><span>Musik</span><div class="seg" id="musicSeg"></div></div>
    <div class="row"><span>Spielstand</span><button id="resetBtn" style="font-weight:800;color:var(--no)">Neues Spiel</button></div>
    <button class="close" id="closeBtn">Weiterspielen</button>
  </div>
</div>
<script>
(() => {
  const $=id=>document.getElementById(id);
  // ---------- state ----------
  const DEF={input:'keys',digitDir:'ltr',sound:true,music:true,crystals:0,berries:0,friends:{brachio:0,rexi:0,trixi:0,spiny:0},order:[],intro:false,smashed:{},qIntro:{},finale:0};
  const load=()=>{ try{ const s=Object.assign({},DEF,JSON.parse(localStorage.getItem('anky2')||'{}')); s.friends=Object.assign({},DEF.friends,s.friends||{}); if(!Array.isArray(s.order)) s.order=[]; if(typeof s.qIntro!=='object'||!s.qIntro) s.qIntro={}; return s; }catch(e){ return JSON.parse(JSON.stringify(DEF)); } };
  const S=load(); const save=()=>{ try{ localStorage.setItem('anky2',JSON.stringify(S)); }catch(e){} };

  // ---------- colors ----------
  const colorOf = n => n<=10 ? `var(--n${n})` : (n%10===0 ? colorOf(n/10) : colorOf(n%10));
  const isTen = c => c==='var(--n10)';
  const HEX={1:'#E8362E',2:'#FF8A1E',3:'#FFD21E',4:'#3DBE4A',5:'#2E7BFF',6:'#8E44D6',7:'#E8362E',8:'#FF5FB0',9:'#8D8D8D',10:'#FFFFFF'};
  const hexOf = n => HEX[n<=10?n:(n%10===0?10:n%10)];

  // ---------- speech ----------
  const hasTTS='speechSynthesis' in window;
  let voices=[], unlocked=false, pending=null, speakTimer=null, lastU=null;
  const loadVoices=()=>{ voices=speechSynthesis.getVoices()||[]; };
  if(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
  const deVoices=()=>voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith('de'));
  const voiceRank=v=>{ const n=(v.name||'').toLowerCase(); let r=1; if(/google|microsoft|natural|neural|premium|enhanced|erweitert/.test(n)) r+=3; if(/anna|petra|helena|katja|vicki|markus|hedda|stefan|conrad|amala|elke|viktoria/.test(n)) r+=2; if(v.localService===false) r+=1; return r; };
  const pickVoice=()=>{ const vs=deVoices(); if(!vs.length) return null; if(S.voice){ const v=vs.find(v=>v.name===S.voice); if(v) return v; } return vs.slice().sort((a,b)=>voiceRank(b)-voiceRank(a))[0]; };
  const sub=$('sub'); let subTimer=null;
  function showSub(text,ms){ sub.innerHTML=text; sub.classList.add('show'); clearTimeout(subTimer); subTimer=setTimeout(()=>sub.classList.remove('show'),ms||Math.max(2200,text.length*70)); }
  function speak(text,opts={}){
    if(opts.sub!==false) showSub(text.replace(/[<>]/g,''));
    if(!S.sound||!hasTTS) return;
    if(!unlocked){ pending={text,opts}; return; }
    pending=null;
    const go=()=>{ const u=new SpeechSynthesisUtterance(text); u.lang='de-DE'; const v=pickVoice(); if(v) u.voice=v; u.rate=opts.rate||0.95; u.pitch=opts.pitch||1.1; lastU=u; try{ speechSynthesis.resume(); speechSynthesis.speak(u); }catch(e){} };
    if(opts.keep){ go(); return; }
    clearTimeout(speakTimer); speechSynthesis.cancel(); speakTimer=setTimeout(go,90);
  }
  const cancelSpeech=()=>{ clearTimeout(speakTimer); pending=null; if(hasTTS) speechSynthesis.cancel(); };
  function unlock(){
    if(unlocked) return; unlocked=true;
    if(hasTTS){ try{ speechSynthesis.resume(); speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){} }
    setTimeout(()=>{ if(pending){ const q=pending; pending=null; speak(q.text,q.opts); } },250);
    Music.unlock();
  }
  document.addEventListener('pointerdown',unlock,{capture:true});

  // ---------- sound effects + music (tiny synth) ----------
  let AC=null; const ac=()=>{ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; };
  function tone(f,d,type,v,ratio,when){ if(!S.sound) return; const a=ac(); if(!a) return; const t=(when||a.currentTime), o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*(ratio||1),t+d); g.gain.setValueAtTime(v||.2,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d); }
  const SFX={
    thump:()=>{ tone(90,.25,'triangle',.5,.4); tone(50,.35,'sine',.5,.5); },
    crumble:()=>{ for(let i=0;i<5;i++) setTimeout(()=>tone(300+Math.random()*400,.08,'square',.05,.6),i*45); },
    good:()=>{ tone(880,.22,'sine',.22,1.5); setTimeout(()=>tone(1320,.3,'sine',.22,1.25),110); },
    bad:()=>tone(240,.28,'triangle',.18,.5),
    tap:()=>tone(600,.06,'sine',.08,1.2),
    squeak:()=>{ tone(1800,.12,'square',.05,.6); setTimeout(()=>tone(1500,.15,'square',.05,.5),90); },
    crystal:()=>{ tone(1568,.18,'sine',.2,1.02); setTimeout(()=>tone(2093,.35,'sine',.2,1.01),120); },
    step:()=>tone(160,.05,'triangle',.04,.8),
    fanfare:()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.18,1.0),i*140)); },
  };
  const Music=(()=>{
    let on=false, timer=null, nextT=0, step=0, seed=7, unlockedM=false;
    const scale=[0,2,4,7,9,12,14,16], base=261.63;
    const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
    function schedule(){
      const a=ac(); if(!a||!on) return;
      while(nextT<a.currentTime+.6){
        const beat=.5; // 120 bpm
        if(step%8===0){ tone(base/2*Math.pow(2,scale[[0,3,4,1][(step/8)%4]]/12),1.6,'sine',.08,1,nextT); }
        if(step%2===0||rnd()<.35){ const n=scale[Math.floor(rnd()*scale.length)]; tone(base*Math.pow(2,n/12),.5,'triangle',.05,1,nextT); }
        if(step%4===2) tone(base*2*Math.pow(2,scale[Math.floor(rnd()*5)]/12),.4,'sine',.03,1,nextT);
        nextT+=beat/2; step++;
      }
    }
    function start(){ if(!S.music||!S.sound||!unlockedM) return; const a=ac(); if(!a) return; on=true; nextT=a.currentTime+.1; clearInterval(timer); timer=setInterval(schedule,250); }
    function stop(){ on=false; clearInterval(timer); timer=null; }
    return {start,stop,unlock:()=>{ unlockedM=true; if(S.music) start(); },sync:()=>{ if(S.music&&S.sound) start(); else stop(); }};
  })();

  // ---------- math task panel ----------
  const task=$('task'), board=$('board'), hint=$('hint'), fig=$('fig'), big=$('big'), pad=$('pad');
  let T=null; // current task: {kind,a,b,cur,max,parts,layout,resolve}
  let typed=[], tries=0, busy=false;
  const digitMode=()=>S.input==='digits';

  function cellSize(cols,rows){
    const bw=board.clientWidth-32, bh=board.clientHeight-76; return Math.max(10,Math.floor(Math.min(bw/(cols+1),bh/(rows+1.6),48)));
  }
  function mkCell(color,c){ const d=document.createElement('div'); d.className='cell'; d.style.background=color; d.style.width=d.style.height=c+'px'; if(isTen(color)) d.classList.add('ten'); return d; }
  // a number as a figure: 1 column up to 10, tens columns + rest above 10
  function towerParts(n,color){ const parts=[]; let x=0; for(let t=0;t<Math.floor(n/10);t++,x++) parts.push({x,n:10,color:color||colorOf(10)}); if(n%10) parts.push({x,n:n%10,color:color||colorOf(n%10)}); return parts; }
  function renderFigure(){
    fig.innerHTML=''; fig.className=''; big.className=''; big.textContent='';
    if(T.kind==='plus'){
      fig.className='row'; const c=cellSize(Math.ceil(T.a/10)+Math.ceil(T.b/10)+2,10);
      [[T.a,'+'],[T.b,'= ?']].forEach(([n,op])=>{
        const part=document.createElement('div'); part.className='part';
        const g=document.createElement('div'); g.className='grid'; g.style.gridTemplateColumns=`repeat(${Math.ceil(n/10)},${c}px)`;
        towerParts(n).forEach(p=>{ for(let i=0;i<p.n;i++){ const d=mkCell(p.color,c); d.style.gridColumn=p.x+1; d.style.gridRow=(11-p.n)+i; g.appendChild(d);} });
        g.style.gridTemplateRows=`repeat(10,${c}px)`; g.style.alignItems='end';
        const l=document.createElement('div'); l.className='lbl'; l.textContent=n; l.style.fontSize=Math.round(c*.8)+'px';
        part.appendChild(g); part.appendChild(l); fig.appendChild(part);
        const o=document.createElement('div'); o.className='op'; o.textContent=op; o.style.fontSize=Math.round(c*.9)+'px'; fig.appendChild(o);
      });
    } else {
      const n=T.kind==='minus'?T.a:T.cur, parts=towerParts(n, T.kind==='minus'?colorOf(T.a):null), cols=parts.length;
      const c=cellSize(cols,Math.min(10,n)); fig.style.gridTemplateColumns=`repeat(${cols},${c}px)`; fig.style.gridTemplateRows=`repeat(${Math.min(10,n)},${c}px)`; fig.style.alignItems='end';
      const cells=[]; parts.forEach(p=>{ for(let i=0;i<p.n;i++){ const d=mkCell(p.color,c); d.style.gridColumn=p.x+1; d.style.gridRow=Math.min(10,n)-i; cells.push(d);} });
      if(T.kind==='minus'){ for(let i=0;i<T.b;i++) cells[cells.length-1-i].classList.add('gone'); }
      cells.forEach(d=>fig.appendChild(d)); fig.classList.add('enter');
    }
  }
  function fitPad(){
    const rows=digitMode()?5:Math.ceil(T.max/10), land=matchMedia('(orientation:landscape)').matches, gap=6;
    const avail=window.innerHeight-40, budget=land?avail:avail*(rows>=3?0.42:0.34);
    let keyH=Math.floor((budget-gap*(rows-1))/rows); keyH=Math.max(30,Math.min(78,keyH));
    pad.style.setProperty('--keyH',keyH+'px');
    const keyW=(pad.clientWidth-gap*(digitMode()?2:9))/(digitMode()?3:10);
    pad.style.setProperty('--keyFont',Math.round(Math.max(11,Math.min(30,keyH*0.42,keyW*0.46)))+'px');
  }
  function slotsOf(){ const n=String(T.cur).length, sl=Array(n).fill(null); typed.forEach((d,i)=>{ sl[S.digitDir==='rtl'?n-1-i:i]=d; }); return sl; }
  function drawSlots(){ const a=$('ans'); if(!a) return; a.innerHTML=''; const sl=slotsOf(), n=sl.length; const nx=typed.length<n?(S.digitDir==='rtl'?n-1-typed.length:typed.length):-1; sl.forEach((d,i)=>{ const e=document.createElement('div'); e.className='ansSlot'+(i===nx?' next':''); e.textContent=d===null?'':d; a.appendChild(e); }); }
  function buildPad(){
    pad.innerHTML=''; typed=[]; pad.classList.toggle('digits',digitMode()); pad.classList.remove('locked');
    if(digitMode()){
      const a=document.createElement('div'); a.id='ans'; pad.appendChild(a);
      ['1','2','3','4','5','6','7','8','9','⌫','0',''].forEach(d=>{
        if(d===''){ pad.appendChild(document.createElement('div')); return; }
        const b=document.createElement('button'); b.className='key'; b.textContent=d;
        if(d==='⌫'){ b.classList.add('del'); b.addEventListener('click',()=>{ if(busy||!typed.length) return; typed.pop(); drawSlots(); }); }
        else { if(d!=='0'){ const dot=document.createElement('span'); dot.className='dot'; dot.style.background=colorOf(+d); b.appendChild(dot);} b.addEventListener('click',()=>typeDigit(+d)); }
        pad.appendChild(b);
      });
      fitPad(); drawSlots(); return;
    }
    for(let i=1;i<=T.max;i++){ const b=document.createElement('button'); b.className='key'; b.dataset.n=i; b.textContent=i; const dot=document.createElement('span'); dot.className='dot'; dot.style.background=colorOf(i); if(isTen(colorOf(i))) dot.classList.add('ten'); b.appendChild(dot); b.addEventListener('click',()=>answer(i,b)); pad.appendChild(b); }
    fitPad();
  }
  function typeDigit(d){
    if(busy) return; const a=$('ans'), n=String(T.cur).length; if(typed.length>=n) return;
    typed.push(d); drawSlots(); speak(String(d),{keep:true,rate:1.05,sub:false});

  const mkSeg=(id,key,vals,labels,after)=>{ const el=$(id); el.innerHTML=''; vals.forEach(v=>{ const b=document.createElement('button'); b.textContent=labels[v]; b.className=S[key]===v?'on':''; b.addEventListener('click',()=>{ S[key]=v; save(); drawSeg(); if(after) after(); }); el.appendChild(b); }); };
  function drawVoices(){ const sel=$('voiceSel'); sel.innerHTML=''; const vs=deVoices().slice().sort((a,b)=>voiceRank(b)-voiceRank(a)); const o=document.createElement('option'); o.value=''; o.textContent=vs.length?'Automatisch (beste gefundene)':'Keine deutsche Stimme gefunden'; sel.appendChild(o); vs.forEach(v=>{ const op=document.createElement('option'); op.value=v.name; op.textContent=v.name.replace(/microsoft |google /i,''); if(S.voice===v.name) op.selected=true; sel.appendChild(op); }); }
  $('voiceSel').addEventListener('change',e=>{ S.voice=e.target.value||null; save(); speak('Hallo Anky! So klinge ich.'); });
  function drawSeg(){ drawVoices(); mkSeg('inputSeg','input',['keys','digits'],{keys:'Tasten',digits:'Ziffern'}); mkSeg('dirSeg','digitDir',['ltr','rtl'],{ltr:'Links → rechts',rtl:'Rechts → links'}); mkSeg('musicSeg','music',[true,false],{true:'An',false:'Aus'},()=>{ Music.sync(); syncBtns(); }); }
  function syncBtns(){ $('soundBtn').textContent=S.sound?'🔊':'🔇'; $('soundBtn').classList.toggle('off',!S.sound); $('musicBtn').classList.toggle('off',!S.music||!S.sound); }
  $('gearBtn').addEventListener('click',()=>{ drawSeg(); $('settings').classList.add('open'); });
  $('closeBtn').addEventListener('click',()=>$('settings').classList.remove('open'));
  $('soundBtn').addEventListener('click',()=>{ S.sound=!S.sound; save(); if(!S.sound) cancelSpeech(); Music.sync(); syncBtns(); });
  $('musicBtn').addEventListener('click',()=>{ S.music=!S.music; save(); Music.sync(); syncBtns(); });
  $('resetBtn').addEventListener('click',()=>{ localStorage.removeItem('anky2'); location.reload(); });

  // ---------- go ----------
  applyProgress(); syncBtns(); hudHearts(); hudBerries(); hudCrys();
  requestAnimationFrame(loop);
  setTimeout(()=>{ if(!S.intro){ S.intro=true; save(); speak('Hallo! Ich bin Okto, und das ist Anky. Tipp irgendwo hin, dann läuft Anky los. Vier kleine Dinos brauchen deine Hilfe – einer im Farnwald, einer im Aschefeld, einer am Fluss und einer am Sumpf. Aber Vorsicht vor dem großen T-Rex!'); } },600);
})();
</script>
</body>
